name: Test

on:
  push:
    branches: [main]      # merges and direct pushes stay tested between PR and tag
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # nightly live model guard on main
  workflow_call:
    inputs:
      model_guard_strict:
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false

# None of these jobs push; model-guard overrides with its own block.
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # Hermetic gate: types, lint, static model check, all fixture suites.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  model-guard:
    # Live per-id probe. Strict on release calls and nightly; warn-and-skip on
    # secretless fork PRs. GHA injects "" for missing secrets and never fails
    # by itself — the strict empty-key failure lives in the script (--strict).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_GUARD_STRICT: ${{ (inputs.model_guard_strict || github.event_name == 'schedule') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm ci: check-models.mjs uses only node: builtins + global fetch.
      - run: npm run test:model-guard
        id: guard
      - name: Alert on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          GUARD_KIND: ${{ steps.guard.outputs.kind }}
          GUARD_DETAIL: ${{ steps.guard.outputs.detail }}
        with:
          script: |
            const kind = process.env.GUARD_KIND
            const detail = process.env.GUARD_DETAIL
            const title = kind === 'key' ? 'Nightly model guard failed — ANTHROPIC_API_KEY is bad or expired'
              : kind === 'stale' ? 'Nightly model guard failed — configured Claude model may be stale'
              : 'Nightly model guard failed'
            const cause = kind === 'key' ? 'Rotate the ANTHROPIC_API_KEY repo secret. This is NOT a stale model.'
              : kind === 'stale' ? 'Update the model default/enum in package.json.'
              : 'Cause unclassified.'
            const body = `${cause}\n\n${detail ? `${detail}\n\n` : ''}Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'model-guard' })
            if (open.length > 0) {
              const changed = open[0].title !== title
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number,
                body: (changed ? `Cause changed from "${open[0].title}" to "${title}".\n\n` : '') + body })
              if (changed) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, title })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['model-guard'] })
            }

  e2e:
    # Hard gate since PE-542: red E2E blocks merges and releases (burn-in
    # soft-gate period per PE-271 spec §4 completed 2026-07-27).
    if: github.event_name != 'schedule'
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          # lockfile hash rotates the key on dependency bumps so the cached
          # VS Code build can refresh; a bare runner.os key is write-once and
          # freezes the first download forever.
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
